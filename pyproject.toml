[project]
name = "sqldoc"
version = "0.1.0"
description = "Explain what a SQL report does, without reading the SQL."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Martin Padilla Schekaiban" }]
keywords = ["sql", "documentation", "lineage", "business-intelligence", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Documentation",
]
dependencies = []

[project.scripts]
sqldoc = "sqldoc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqldoc"]
